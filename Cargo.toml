[package]
name = "rev-desktop"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "rev"

[[bin]]
name = "rev"
path = "native/main.rs"

[dependencies]
gpui-kit = { version = "=0.8.0", features = ["tree-sitter-rust", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-javascript", "tree-sitter-python", "tree-sitter-markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Direct dependencies used by the app-owned diff component.
similar = { version = "2.7", features = ["unicode"] }
smallvec = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
rust-i18n = "4.2.0"
tree-sitter-highlight = "0.26"

[dev-dependencies]
gpui-kit = { version = "=0.8.0", features = ["test-support"] }

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 16

